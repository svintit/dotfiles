bind -T zpane w run-shell '$HOME/.local/bin/tmux-popup-toggle-ghostty'
bind -T zpane z if -F '#{==:#{pane-border-status},off}' 'set -g pane-border-status top' 'set -g pane-border-status off' \; switch-client -T root
bind -T zpane c command-prompt -I "#T" "rename-pane -- '%%'" \; switch-client -T root
bind -T zpane Enter switch-client -T root
bind -T zpane Escape switch-client -T root
bind -T zpane C-p switch-client -T root

bind -T ztab Left previous-window
bind -T ztab Up previous-window
bind -T ztab h previous-window
bind -T ztab k previous-window
bind -T ztab Right next-window
bind -T ztab Down next-window
bind -T ztab j next-window
bind -T ztab l next-window
bind -T ztab 1 select-window -t :=1 \; switch-client -T root
bind -T ztab 2 select-window -t :=2 \; switch-client -T root
bind -T ztab 3 select-window -t :=3 \; switch-client -T root
bind -T ztab 4 select-window -t :=4 \; switch-client -T root
bind -T ztab 5 select-window -t :=5 \; switch-client -T root
bind -T ztab 6 select-window -t :=6 \; switch-client -T root
bind -T ztab 7 select-window -t :=7 \; switch-client -T root
bind -T ztab 8 select-window -t :=8 \; switch-client -T root
bind -T ztab 9 select-window -t :=9 \; switch-client -T root
bind -T ztab n run-shell '$HOME/.local/bin/tmux-new-window-fast-name-ghostty' \; switch-client -T root
