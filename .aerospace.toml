after-startup-command = ['exec-and-forget sketchybar', 'exec-and-forget $HOME/.local/bin/aerospace-spotify-pin']

# Update workspace integrations after each workspace change.
exec-on-workspace-change = ['/bin/bash', '-c',
  '/usr/bin/nohup /Applications/Hammerspoon.app/Contents/Frameworks/hs/hs -q -t 1 -c "if _G.refreshBorderForWorkspace then _G.refreshBorderForWorkspace() end; if _G.workspaceIndicator then _G.workspaceIndicator.refresh() end" </dev/null >/dev/null 2>&1 & /usr/bin/nohup $HOME/.local/bin/aerospace-spotify-pin </dev/null >/dev/null 2>&1 & sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE >/dev/null 2>&1 &',
  'exec-and-forget borders active_color=0xffe1e3e4 inactive_color=0xff494d64 width=5.0'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 300

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
# on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
on-focused-monitor-changed = ['exec-and-forget /Applications/Hammerspoon.app/Contents/Frameworks/hs/hs -q -t 1 -c "if _G.workspaceIndicator then _G.workspaceIndicator.refresh() end" </dev/null >/dev/null 2>&1']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodness#disable-hide-app
automatically-unhide-macos-hidden-apps = false

# Move Safari to workspace T on focus. on-window-detected does not fire for
# Safari because AeroSpace's closed-window cache restores reopened windows
# and skips on-window-detected; on-focus-changed catches it instead.
on-focus-changed = ['exec-and-forget $HOME/.local/bin/aerospace-safari-pin', 'exec-and-forget /Applications/Hammerspoon.app/Contents/Frameworks/hs/hs -q -t 1 -c "if _G.workspaceIndicator then _G.workspaceIndicator.scheduleSelectionSync() end"']


# Default all windows to floating. Specific apps below override to tiling.
[[on-window-detected]]
check-further-callbacks = true
run = ['layout floating', 'exec-and-forget /Applications/Hammerspoon.app/Contents/Frameworks/hs/hs -q -t 1 -c "if _G.workspaceIndicator then _G.workspaceIndicator.refresh() end"']

[[on-window-detected]]
if.app-name-regex-substring = '^spotify$'
if.window-title-regex-substring = '^Spotify - Web Player:| - Your Chromium$'
run = 'exec-and-forget $HOME/.local/bin/aerospace-spotify-pin'

[[on-window-detected]]
if.app-name-regex-substring = 'iterm'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-name-regex-substring = 'ghostty'
run = ['layout tiling', 'move-node-to-workspace T']


[[on-window-detected]]
if.app-name-regex-substring = 'kitty'
run = 'move-node-to-workspace T'

[[on-window-detected]]
if.app-name-regex-substring = 'obsidian'
run = 'move-node-to-workspace O'

[[on-window-detected]]
if.app-name-regex-substring = 'spotify'
run = ['layout tiling', 'move-node-to-workspace M']

[[on-window-detected]]
if.app-name-regex-substring = 'messages'
run = ['layout tiling', 'move-node-to-workspace M']

[[on-window-detected]]
if.app-name-regex-substring = 'chrome'
run = ['layout tiling', 'move-node-to-workspace W', 'layout tiles vertical --root']

[[on-window-detected]]
if.app-name-regex-substring = 'slack'
run = ['layout tiling', 'move-node-to-workspace W', 'layout tiles vertical --root']

[[on-window-detected]]
if.app-name-regex-substring = 'cursor'
run = ['layout tiling', 'move-node-to-workspace CODE']

[[on-window-detected]]
if.app-name-regex-substring = 'code'
run = ['layout tiling', 'move-node-to-workspace CODE']

[[on-window-detected]]
if.app-name-regex-substring = 'zed'
run = ['layout tiling', 'move-node-to-workspace CODE']


# Possible values: (qwerty|dvorak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See: https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
inner.horizontal = 20
inner.vertical =   20
outer.left =       40
outer.bottom =     40
# Per-monitor outer.top can be configured locally, e.g.:
# outer.top = [{ monitor.<name> = 70 }, { monitor.built-in = 32 }, 40]
outer.top =        40
outer.right =      40

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

# All possible keys:
# - Letters.        a, b, c, ..., z
# - Numbers.        0, 1, 2, ..., 9
# - Keypad numbers. keypad0, keypad1, keypad2, ..., keypad9
# - F-keys.         f1, f2, ..., f20
# - Special keys.   minus, equal, period, comma, slash, backslash, quote, semicolon, backtick,
#                   leftSquareBracket, rightSquareBracket, space, enter, esc, backspace, tab
# - Keypad special. keypadClear, keypadDecimalMark, keypadDivide, keypadEnter, keypadEqual,
#                   keypadMinus, keypadMultiply, keypadPlus
