set -g default-shell "/opt/homebrew/bin/fish"
set -g default-terminal "tmux-256color"
set -g terminal-features 'xterm-ghostty:RGB:clipboard:focus:hyperlinks:sync,tmux-256color:RGB:clipboard:focus:hyperlinks:sync'
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0
set -g focus-events on
set -g mouse on
set -g allow-passthrough on
set -g status off
set -g pane-border-lines single
set -g pane-border-style "fg=#383838,bg=#0a0c14"
set -g pane-active-border-style "fg=#383838,bg=#0a0c14"
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g remain-on-exit off
set -g exit-empty off
set -g exit-unattached off
set -g prefix C-q
unbind C-b
set-hook -g client-attached[80] 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control resize"'
set-hook -g client-resized[80] 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control resize"'
bind C-q send-prefix
bind B run-shell -b '$HOME/.local/bin/tmux-pi-sidebar-outer-control toggle'

