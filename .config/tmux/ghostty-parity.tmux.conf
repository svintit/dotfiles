bind -T ztmux '%' run-shell '$HOME/.local/bin/tmux-split-with-gap-ghostty h 3' \; switch-client -T root
bind -T ztmux ',' command-prompt -I "#W" "rename-window -- '%%'" \; set-window-option automatic-rename off \; switch-client -T root
bind -T ztmux '[' copy-mode \; switch-client -T root
bind -T ztmux c run-shell '$HOME/.local/bin/tmux-new-window-fast-name-ghostty' \; switch-client -T root
bind -T ztmux n next-window \; switch-client -T root
bind -T ztmux p previous-window \; switch-client -T root
