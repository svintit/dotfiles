bind -T zpane l run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty R' \; switch-client -T root
bind -T zpane n run-shell '$HOME/.local/bin/tmux-split-with-gap-ghostty v 1' \; switch-client -T root
bind -T zpane d run-shell '$HOME/.local/bin/tmux-split-with-gap-ghostty v 1' \; switch-client -T root
bind -T zpane r run-shell '$HOME/.local/bin/tmux-split-with-gap-ghostty h 3' \; switch-client -T root
bind -T zpane p last-pane
