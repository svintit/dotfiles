##### tmux profile: ghostty-parity
##### Goal: one Ghostty surface, tmux owns tabs (windows) and panes.

##### Core behavior
set -g default-shell "/opt/homebrew/bin/fish"
set -g pane-border-lines single
set -g pane-border-style "fg=#383838,bg=#0a0c14"
set -g pane-active-border-style "fg=#383838,bg=#0a0c14"
set -g status 2
set -g status-position bottom
# Run continuum from the visible status format. With custom status-format
# lines, the usual hidden status-right hook is not always evaluated.
# Tab titles disabled - bullets only, no window names. Top row is continuum (empty).
# To restore window names: uncomment the original status-format[1] below.
# set -g status-format[1] "#[align=centre]#{W:#[range=window|#{window_index}]#{?#{!=:#{window_index},1},#[fg=#2a2a3a] ● ,} #[fg=#5c5c7a]#{?@pi_window_title,#{@pi_window_title},#{window_name}}#{?@pi_window_signal, #{@pi_window_signal},} #[norange],#[range=window|#{window_index}]#{?#{!=:#{window_index},1},#[fg=#2a2a3a] ● ,} #[fg=#ffcc66 bold]#{?@pi_window_title,#{@pi_window_title},#{window_name}}#{?@pi_window_signal, #{@pi_window_signal},} #[norange]}#[default]"
set -g status-format[0] "#($HOME/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh)"
set -g status-format[1] "#[align=centre]#{W:#[range=window|#{window_index}]#{?#{!=:#{window_index},1}, ,}#[fg=#5c5c7a] ● #[norange],#[range=window|#{window_index}]#{?#{!=:#{window_index},1}, ,}#[fg=#ffcc66 bold] ● #[norange]}#[default]"
set -gu status-format[2]
set -gu status-format[3]
set -g status-justify centre
set -g status-style "bg=#0a0c14,fg=#5c5c7a"
set -g status-left ""
set -g status-right ""
set -g status-left-length 0
# Keep Ghostty/macOS window title in sync for Hammerspoon tmux session pill.
# Tab titles disabled - uncomment to restore the terminal/Ghostty window title.
# set -g set-titles on
# set -g set-titles-string "#S · #W"
set -g set-titles off
# Keep this non-zero so tmux-continuum's hidden status-right hook still runs.
set -g status-right-length 1
set -g window-status-separator " ● "
# Tab titles disabled - uncomment to restore window-status name rendering.
# set -g window-status-format " #{window_name} "
# set -g window-status-current-format " #{window_name} "
set -g window-status-format " "
set -g window-status-current-format " "
set -g window-status-style "bg=#0a0c14,fg=#5c5c7a"
set -g window-status-current-style "bg=#0a0c14,fg=#ffcc66,bold"
set -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1
set -g set-clipboard on
set -s copy-command "pbcopy"
set -g status-interval 2
set -g allow-rename off
set -g automatic-rename off
set -g exit-empty on
set -g exit-unattached off
set -g detach-on-destroy no-detached
set -g default-terminal "tmux-256color"
set-environment -g GHOSTTY_TMUX_PARITY 1
set -g extended-keys on
set -g extended-keys-format csi-u
set -sg escape-time 0
set -g history-limit 50000
# sync = synchronized output (mode 2026): Ghostty commits each redraw
# atomically, so the cursor hide/show cycle inside repaints never renders.
set -as terminal-features ',xterm-ghostty:RGB:clipboard:focus:hyperlinks:sync'
set -as terminal-features ',ghostty:RGB:clipboard:focus:hyperlinks:sync'
set -as terminal-overrides ',xterm*:Tc'
set -g mouse on

##### Ghostty forwarded custom shortcuts
set -s user-keys[0] "\e[5;30001~"  # cmd+t
set -s user-keys[1] "\e[5;30002~"  # cmd+shift+]
set -s user-keys[2] "\e[5;30003~"  # cmd+shift+[
set -s user-keys[3] "\e[5;30004~"  # alt+1
set -s user-keys[4] "\e[5;30005~"  # alt+2
set -s user-keys[5] "\e[5;30006~"  # alt+3
set -s user-keys[6] "\e[5;30007~"  # alt+4
set -s user-keys[7] "\e[5;30008~"  # alt+5
set -s user-keys[8] "\e[5;30009~"  # alt+6
set -s user-keys[9] "\e[5;30010~"  # alt+7
set -s user-keys[10] "\e[5;30011~" # alt+8
set -s user-keys[11] "\e[5;30012~" # alt+9
set -s user-keys[12] "\e[5;30013~" # cmd+w
set -s user-keys[13] "\e[5;30014~" # alt+backslash
set -s user-keys[14] "\e[5;30015~" # alt+minus
set -s user-keys[15] "\e[5;30016~" # cmd+ctrl+left
set -s user-keys[16] "\e[5;30017~" # cmd+ctrl+right
set -s user-keys[17] "\e[5;30018~" # cmd+ctrl+up
set -s user-keys[18] "\e[5;30019~" # cmd+ctrl+down
set -s user-keys[19] "\e[5;30020~" # alt+]
set -s user-keys[20] "\e[5;30021~" # alt+equal
set -s user-keys[21] "\e[5;30022~" # cmd+shift+t -> restore last closed pane
set -s user-keys[22] "\e[5;30023~" # cmd+shift+equal
set -s user-keys[23] "\e[5;30024~" # cmd+p
set -s user-keys[24] "\e[5;30025~" # alt+p
set -s user-keys[25] "\e[5;30026~" # section (§)

##### Native no-prefix bindings
# Single § opens the popup after a short delay; double § opens the sesh picker. Tab is passed through normally.
unbind -n Tab
unbind -n User26

# Keep the sesh picker list hot so fzf can read it from cache immediately.
set-hook -g client-session-changed 'run-shell -b "$HOME/.local/bin/sesh-tmux-popup --refresh tmux"'
set-hook -g session-renamed 'run-shell -b "$HOME/.local/bin/sesh-tmux-popup --refresh tmux"'
set-hook -g session-closed 'run-shell -b "$HOME/.local/bin/sesh-tmux-popup --refresh tmux"'

unbind -n M-f
bind -n M-h if-shell '[ "#{pane_current_command}" = "nvim" ] || [ "#{pane_current_command}" = "vim" ]' 'send-keys M-h' 'run-shell "$HOME/.local/bin/tmux-select-real-pane-ghostty L"'
bind -n M-j if-shell '[ "#{pane_current_command}" = "nvim" ] || [ "#{pane_current_command}" = "vim" ]' 'send-keys M-j' 'run-shell "$HOME/.local/bin/tmux-select-real-pane-ghostty D"'
bind -n M-k if-shell '[ "#{pane_current_command}" = "nvim" ] || [ "#{pane_current_command}" = "vim" ]' 'send-keys M-k' 'run-shell "$HOME/.local/bin/tmux-select-real-pane-ghostty U"'
bind -n M-l if-shell '[ "#{pane_current_command}" = "nvim" ] || [ "#{pane_current_command}" = "vim" ]' 'send-keys M-l' 'run-shell "$HOME/.local/bin/tmux-select-real-pane-ghostty R"'
unbind -n M-Right
bind -n M-i swap-window -t -1
bind -n M-o swap-window -t +1
bind -n M-[ previous-layout
bind -n M-x swap-pane -D
unbind -n C-q
bind -n MouseDown1Status select-window -t =

##### Ghostty-forwarded macOS shortcuts
bind -n User0 run-shell '$HOME/.local/bin/tmux-new-window-fast-name-ghostty'
bind -n User1 next-window
bind -n User2 previous-window
bind -n User3 select-window -t :=1
bind -n User4 select-window -t :=2
bind -n User5 select-window -t :=3
bind -n User6 select-window -t :=4
bind -n User7 select-window -t :=5
bind -n User8 select-window -t :=6
bind -n User9 select-window -t :=7
bind -n User10 select-window -t :=8
bind -n User11 select-window -t :=9
bind -n User12 run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" TMUX_CONTEXT_WINDOW="#{window_id}" TMUX_CONTEXT_PANE="#{pane_id}" $HOME/.local/bin/tmux-close-popup-or-smart-close-ghostty'
bind -n User13 run-shell '$HOME/.local/bin/tmux-split-with-gap-ghostty h 3'
bind -n User14 run-shell '$HOME/.local/bin/tmux-split-with-gap-ghostty v 1'
bind -n User15 resize-pane -L 3
bind -n User16 resize-pane -R 3
bind -n User17 resize-pane -U 2
bind -n User18 resize-pane -D 2
bind -n User19 run-shell '$HOME/.local/bin/tmux-toggle-assistant-pane-ghostty claude 35 3'
bind -n User20 run-shell '$HOME/.local/bin/tmux-toggle-assistant-pane-ghostty opencode 35 3'
bind -n User21 run-shell -b 'PI_SIDEBAR_CLIENT="#{client_name}" $HOME/.local/bin/tmux-pi-sidebar --restore-last'
bind -n User22 run-shell '$HOME/.local/bin/tmux-resize-assistant-pane-ghostty claude 35'
bind -n User23 run-shell "$HOME/.local/bin/tmux-pi-here #{pane_id}"
bind -n User24 run-shell "$HOME/.local/bin/tmux-pi-here #{pane_id}"
bind -n M-F run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" TMUX_CONTEXT_WINDOW="#{window_id}" TMUX_CONTEXT_PANE="#{pane_id}" $HOME/.local/bin/tmux-popup-toggle-ghostty'
bind -n User25 run-shell -b 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" TMUX_CONTEXT_WINDOW="#{window_id}" TMUX_CONTEXT_PANE="#{pane_id}" TMUX_TARGET_PATH="#{pane_current_path}" $HOME/.local/bin/tmux-double-section-sesh'

##### Keep a fallback tmux prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

##### Modes
bind -n C-g switch-client -T zlocked
bind -n C-p switch-client -T zpane
bind -n C-t switch-client -T ztab
bind -n C-n switch-client -T zresize
bind -n C-h switch-client -T zmove
bind -n C-s copy-mode
bind -n C-o choose-tree -Zw
bind -n C-b switch-client -T ztmux

bind -T zlocked C-g switch-client -T root

unbind -q -T popup M-Right

bind -T zpane Left run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty L' \; switch-client -T root
bind -T zpane Down run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty D' \; switch-client -T root
bind -T zpane Up run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty U' \; switch-client -T root
bind -T zpane Right run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty R' \; switch-client -T root
bind -T zpane h run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty L' \; switch-client -T root
