# Fix terminal type for proper color and italic support
set -g default-terminal "tmux-256color"

# Enable truecolor, italics, and hyperlinks for outer terminals
set -g terminal-features 'xterm*:clipboard:ccolour:cstyle:focus:title,screen*:title,rxvt*:ignorefkeys,xterm-ghostty:RGB:hyperlinks,ghostty:RGB:hyperlinks'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:sitm=\E[3m:ritm=\E[23m'
set -g extended-keys-format csi-u

# Keep tmux status/tab clicks working; use Shift+Cmd-click for Ghostty URL clicks
set -g mouse on

# Sesh session picker
bind-key S run-shell "TMUX_TARGET_CLIENT='#{client_tty}' TMUX_TARGET_PATH='#{pane_current_path}' $HOME/.local/bin/tmux-open-sesh-popup"
