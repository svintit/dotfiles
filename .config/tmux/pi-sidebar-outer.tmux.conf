bind -n MouseDown1Pane if -F '#{==:#{mouse_pane},#{@pi_outer_sidebar_pane}}' 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control mouse sidebar 0 #{mouse_x} #{mouse_y}"' 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control mouse inner 0 #{mouse_x} #{mouse_y}"'
bind -n WheelUpPane if -F '#{==:#{mouse_pane},#{@pi_outer_sidebar_pane}}' 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control mouse sidebar 64 #{mouse_x} #{mouse_y}"' 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control mouse inner 64 #{mouse_x} #{mouse_y}"'
bind -n WheelDownPane if -F '#{==:#{mouse_pane},#{@pi_outer_sidebar_pane}}' 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control mouse sidebar 65 #{mouse_x} #{mouse_y}"' 'run-shell -b "$HOME/.local/bin/tmux-pi-sidebar-outer-control mouse inner 65 #{mouse_x} #{mouse_y}"'
