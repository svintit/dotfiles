bind -T ztmux Down run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty D' \; switch-client -T root
bind -T ztmux Up run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty U' \; switch-client -T root
bind -T ztmux Right run-shell '$HOME/.local/bin/tmux-select-real-pane-ghostty R' \; switch-client -T root
