bind -T ztmux z resize-pane -Z \; switch-client -T root
bind -T ztmux x kill-pane \; switch-client -T root
bind -T ztmux d detach-client \; switch-client -T root
bind -T ztmux C-b send-keys C-b \; switch-client -T root
bind -T ztmux Enter switch-client -T root
bind -T ztmux Escape switch-client -T root

unbind -q -T popup M-f
bind -T popup M-F run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" $HOME/.local/bin/tmux-close-popup-ghostty'
bind -T popup User25 run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" $HOME/.local/bin/tmux-close-popup-ghostty'
bind -T popup Escape run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" $HOME/.local/bin/tmux-close-popup-ghostty'
bind -T popup C-d run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" $HOME/.local/bin/tmux-close-popup-ghostty'
bind -T popup C-s copy-mode
bind -T popup User12 run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" $HOME/.local/bin/tmux-close-popup-ghostty'
bind -T popup User21 run-shell 'TMUX_CONTEXT_SESSION="#{session_name}" TMUX_CONTEXT_CLIENT="#{client_name}" TMUX_CONTEXT_TTY="#{client_tty}" $HOME/.local/bin/tmux-close-popup-ghostty'
bind -T popup MouseDown1Pane select-pane -t = \; send-keys -M
bind -T popup MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e -M'
bind -T popup WheelUpPane if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e'
bind -T popup DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe }
bind -T popup TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe }

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi / command-prompt -p "search down" "send -X search-forward '%%'"
bind -T copy-mode-vi ? command-prompt -p "search up" "send -X search-backward '%%'"
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi C-[ send -X cancel
# Smooth wheel scrolling in tmux history.
bind -T copy-mode-vi WheelUpPane select-pane \; send-keys -X -N 1 scroll-up
bind -T copy-mode-vi WheelDownPane select-pane \; send-keys -X -N 1 scroll-down
# Fix: mouse copy stays in copy mode instead of jumping to bottom.
# copy-pipe copies to clipboard (set-clipboard on), clears selection, stays in copy mode.
# copy-mode -e: any unbound key exits copy mode and passes through to the shell.
# Root table overrides: default tmux uses copy-mode -M and copy-pipe-and-cancel (jumps).
bind -T root MouseDrag1Pane if-shell -F '#{||:#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e -M'
bind -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe }
bind -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -e -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe }
# Copy-mode-vi table: mouse end and in-mode double/triple click also use copy-pipe.
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe
# Unbound printable keys exit copy mode and pass through to the shell.
source-file -q ~/.config/tmux/copy-mode-exit-keys.tmux.conf

##### Pi sidebar
# Reversible include. Remove this block to fully detach the sidebar config.
source-file -q ~/.config/tmux/pi-sidebar.tmux.conf

##### Session persistence
# Keep TPM on legacy path until plugins move to ~/.config/tmux/plugins.
run 'tmux set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '1'
# Give TPM enough time to load before giving up on auto-restore (default 10s is too tight)
set -g @continuum-restore-max-delay '60'
# Avoid restore races from pane-content replay on startup.
set -g @resurrect-capture-pane-contents 'off'
# Restore durable interactive tools only. Shell helper children like fish -c
# from tab-title refresh can otherwise get saved and replayed on boot.
# Pi restored via post-restore hook to resume correct sessions (bare 'pi' starts fresh)
set -g @resurrect-processes 'ssh nvim vim claude opencode'
set -g @resurrect-hook-post-restore-all '$HOME/.local/bin/tmux-resurrect-restore-pi'

# Manual save/restore in addition to automatic continuum snapshots
bind S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh'
bind R run-shell '~/.tmux/plugins/tmux-resurrect/scripts/restore.sh'

run '~/.tmux/plugins/tpm/tpm'

# Per-pane symmetric margins via PTY wrapper (3 cols each side, 1 row top)
set -g default-command "$HOME/.local/bin/fish-pad 3:1"

set -g pane-border-indicators off
set -as terminal-features ',tmux-256color:RGB:clipboard:focus:sync'
